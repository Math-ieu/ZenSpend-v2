name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "zenspendproject/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write # OIDC vers AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: zenspend-prod-backend
  ECS_CLUSTER: zenspend-prod-cluster
  ECS_SERVICE: zenspend-prod-backend

jobs:
  deploy:
    name: Build image & deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -f zenspendproject/Dockerfile.prod \
            -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::8}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::8}"

      - name: Force ECS deployment & wait for stability
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
