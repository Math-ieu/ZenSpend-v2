name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "zenspendfrontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true
    
permissions:
  id-token: write # OIDC vers AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  FRONTEND_BUCKET: zenspend-prod-frontend

jobs:
  deploy:
    name: Build SPA & sync to S3/CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zenspendfrontend/package-lock.json

      - name: Build
        working-directory: zenspendfrontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 & invalidate CloudFront
        run: |
          aws s3 sync zenspendfrontend/dist/ "s3://$FRONTEND_BUCKET/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.FRONTEND_CF_ID }}" --paths "/*"
