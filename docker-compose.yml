version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: zenspendproject/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./zenspendproject:/app
    env_file:
      - backend.env
    depends_on:
      - db
    labels:
      # Scheduled Django management commands, run by the `scheduler` service.
      # Times are UTC, format: "second minute hour day month weekday".
      ofelia.enabled: "true"
      ofelia.job-exec.recurring-transactions.schedule: "0 30 0 * * *"
      ofelia.job-exec.recurring-transactions.command: "python manage.py generate_recurring_transactions"
      ofelia.job-exec.purge-accounts.schedule: "0 0 3 * * *"
      ofelia.job-exec.purge-accounts.command: "python manage.py purge_deleted_accounts"
      ofelia.job-exec.notifications.schedule: "0 0 7 * * *"
      ofelia.job-exec.notifications.command: "python manage.py generate_notifications"

  # Lightweight cron for docker-compose: reads the ofelia.* labels above and
  # execs the commands inside the running backend container on schedule.
  scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      - backend
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: zenspendfrontend/Dockerfile
    ports:
      - "3000:80"
  
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zenspend_db
      POSTGRES_USER: mathieu
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
