version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: zenspendproject/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./zenspendproject:/app
    env_file:
      - backend.env
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: zenspendfrontend/Dockerfile
    ports:
      - "3000:80"
  
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zenspend_db
      POSTGRES_USER: mathieu
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
